<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No maximum-scale: it blocks zoom (WCAG 1.4.4) outside iOS Safari. The
         cost is that iOS zooms in on any control whose text is under 16px when
         it takes focus, and never zooms back out, so every text field is at
         least text-base below md.

         interactive-widget: on Chrome the on-screen keyboard resizes only the
         visual viewport by default, so a height:100% app keeps its full height
         and the keyboard covers the composer. resizes-content shrinks the
         layout viewport instead, and the app pushes itself up. Safari ignores
         this, which is what useKeyboardInset is for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Lime — local AI chat</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
