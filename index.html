<!doctype html>
<html lang="en" class="dark">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale: stops iOS Safari zooming the page in when a control
         whose text is under 16px takes focus, and never zooming back out.
         Since iOS 10 Safari honours pinch-zoom regardless of this value, so it
         suppresses the automatic zoom without taking manual zoom away.

         interactive-widget: on Chrome the on-screen keyboard resizes only the
         visual viewport by default, so a height:100% app keeps its full height
         and the keyboard covers the composer. resizes-content shrinks the
         layout viewport instead, and the app pushes itself up. Safari ignores
         this, which is what useKeyboardInset is for. -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content" />
    <title>Lime | Local Chat</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
